name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install pnpm first so setup-node's pnpm cache can resolve the store.
      # Version comes from the "packageManager" field in package.json (pnpm@10).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      # A passing tsc is not evidence that the output runs: the compiled backend
      # was unrunnable for the project's whole life because nothing ever started it.
      - name: Smoke the built backend
        run: |
          node apps/backend/dist/main.js &
          SERVER_PID=$!
          for _ in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8787/healthz; then
              kill $SERVER_PID
              exit 0
            fi
            sleep 0.5
          done
          echo "backend did not become healthy"
          kill $SERVER_PID || true
          exit 1

      # `pnpm dev` must work on a clean checkout, i.e. with no packages/protocol/dist.
      # tsx only resolves @echoflow/protocol to TypeScript source when it is passed
      # --conditions=echoflow-source; without that flag it takes the package's
      # `default` export condition and dies with ERR_MODULE_NOT_FOUND. Deleting dist/
      # is why this runs last.
      - name: Smoke the dev server with no built protocol
        run: |
          rm -rf packages/protocol/dist
          setsid pnpm --filter @echoflow/backend dev &
          SERVER_PID=$!
          # pnpm run spawns tsx as a child, so kill the whole process group.
          stop() { kill -- "-${SERVER_PID}" 2>/dev/null || kill "${SERVER_PID}" 2>/dev/null || true; }
          for _ in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8787/healthz; then
              stop
              exit 0
            fi
            sleep 0.5
          done
          echo "dev server did not become healthy without packages/protocol/dist"
          stop
          exit 1
