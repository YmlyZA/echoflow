name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    outputs:
      versionName: ${{ steps.ver.outputs.versionName }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      # Install pnpm first so setup-node's pnpm cache can resolve the store.
      # Version comes from the "packageManager" field in package.json (pnpm@10).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Turn the tag into version fields via the same tested helper the build uses.
      - name: Derive version from tag
        id: ver
        run: pnpm --filter @echoflow/extension exec tsx scripts/print-version.ts "${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      # Never publish a broken build.
      - run: pnpm typecheck
      - run: pnpm test

      - name: Build and zip the extension
        env:
          EF_VERSION_NAME: ${{ steps.ver.outputs.versionName }}
        run: pnpm --filter @echoflow/extension zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apps/extension/.output/echoflow-*-chrome.zip
          prerelease: ${{ steps.ver.outputs.prerelease }}
          generate_release_notes: true

  image:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the runner's own architecture first and actually start it. Nothing
      # else in this pipeline ever runs the image: the Dockerfile's
      # `CI=true pnpm prune --prod` + offline reinstall is a workaround for a
      # pnpm 10 symlink bug, and if a pnpm bump changes that behaviour the
      # failure is ERR_MODULE_NOT_FOUND at container start — which a build-only
      # job publishes straight to `latest` with no signal at all. This also
      # exercises ECHOFLOW_HOST=0.0.0.0 and the published port, neither of which
      # any unit test can reach.
      - name: Build the image for this runner
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: echoflow-backend:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke the image
        run: |
          docker run -d --name echoflow-smoke -p 127.0.0.1:8787:8787 echoflow-backend:smoke
          stop() { docker rm -f echoflow-smoke >/dev/null 2>&1 || true; }
          for _ in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8787/healthz; then
              stop
              exit 0
            fi
            sleep 0.5
          done
          echo "container did not become healthy"
          docker logs echoflow-smoke || true
          stop
          exit 1

      # Same context, same cache — the amd64 layers are already warm, so this
      # only builds arm64 on top.
      - name: Build and push the multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # Hardcoded lowercase owner: the actual GitHub login is "YmlyZA" (mixed
          # case), but OCI repository names must be lowercase and the README's
          # quickstart command names this image exactly as ghcr.io/ymlyza/...
          tags: |
            ghcr.io/ymlyza/echoflow-backend:${{ needs.release.outputs.versionName }}
            ${{ needs.release.outputs.prerelease == 'false' && 'ghcr.io/ymlyza/echoflow-backend:latest' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
